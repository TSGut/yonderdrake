name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify the release tag matches the packaged version
        run: |
          version=$(python -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              '_v', 'src/yonderdrake/_version.py'
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.__version__)
          ")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "release tag '$tag' does not match _version.py '$version'"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
