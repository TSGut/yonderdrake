[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yonderdrake"
dynamic = ["version"]
description = "A library for nonlocal time and space operators in Firedrake"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Timon S. Gutleb" },
]
keywords = [
  "caputo",
  "finite-element-method",
  "firedrake",
  "fractional-calculus",
  "fractional-laplacian",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = [
  "mpmath>=1.3",
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "ruff>=0.6",
  "yonderdrake[test]",
]
visual = [
  "matplotlib>=3.9",
  "pillow>=10",
]
docs = [
  "furo>=2024.8.6",
  "myst-parser>=4",
  "sphinx>=8,<9",
  "sphinx-copybutton>=0.5",
]

[project.urls]
Documentation = "https://timon.gutleb.com/yonderdrake/"
Homepage = "https://github.com/TSGut/yonderdrake"
Issues = "https://github.com/TSGut/yonderdrake/issues"
Source = "https://github.com/TSGut/yonderdrake"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yonderdrake = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "yonderdrake._version.__version__" }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning:pyop2.utils",
]
markers = [
  "unit: fast tests of isolated numerical or API components",
  "verification: numerical verification against an independent reference",
  "slow: computationally expensive tests",
  "parallel: tests requiring more than one MPI rank",
  "performance: non-functional performance measurements",
]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["yonderdrake"]

[tool.coverage.report]
fail_under = 97.0
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/yonderdrake"]
strict = true
no_site_packages = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "firedrake",
  "firedrake.*",
  "mpi4py",
  "mpi4py.*",
  "petsc4py",
  "petsc4py.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ufl", "ufl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yonderdrake.time._ufl_marker"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "yonderdrake._external",
  "yonderdrake.periodic._external",
  "yonderdrake.riesz._external",
  "yonderdrake.spectral._external",
]
ignore_errors = true
